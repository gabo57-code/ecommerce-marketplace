<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Barra superior del vendedor -->
<header class="topbar" th:fragment="seller-header(name)">
    <link rel="stylesheet" th:href="@{/css/theme-space.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/seller/dashboard}">MiMercado <small>Vendedor</small></a>
        <div class="topbar-user">
            <a th:href="@{/shop}">Ir a comprar</a>
            <a th:href="@{/seller/dashboard}">Mis productos</a>
            <a th:href="@{/seller/sales}">Mis ventas</a>
            <a th:href="@{/seller/products/new}">Publicar</a>
            <span th:text="${name}">Vendedor</span>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <button type="submit" class="btn btn-small btn-outline">Cerrar sesión</button>
            </form>
        </div>
    </div>
</header>

<!-- Barra superior del comprador (buscador + carrito) -->
<header class="topbar" th:fragment="shop-header(name, q)">
    <link rel="stylesheet" th:href="@{/css/cart.css}">
    <link rel="stylesheet" th:href="@{/css/theme-space.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <div class="topbar-inner shop-bar">
        <a class="brand" th:href="@{/shop}">MiMercado</a>
        <form class="search" th:action="@{/shop}" method="get">
            <input type="text" name="q" th:value="${q}" placeholder="Buscar productos...">
            <button type="submit">Buscar</button>
        </form>
        <div class="topbar-user">
            <a th:if="${isSeller}" th:href="@{/seller/dashboard}">Mi tienda</a>
            <a th:unless="${isSeller}" th:href="@{/account/sell}">Quiero vender</a>
            <a th:href="@{/shop/orders}">Mis compras</a>
            <a th:href="@{/cart}">Carrito<span class="cart-badge" th:if="${cartCount > 0}" th:text="${cartCount}">0</span></a>
            <span th:text="${name}">Comprador</span>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <button type="submit" class="btn btn-small btn-outline">Cerrar sesión</button>
            </form>
        </div>
    </div>
</header>

</body>
</html>
