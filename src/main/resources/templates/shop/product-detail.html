<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name} + ' - MiMercado'">Producto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/shop.css}">
    <link rel="stylesheet" th:href="@{/css/reviews.css}">
</head>
<body>
<header th:replace="~{fragments :: shop-header(${user.fullName}, '')}"></header>

<main class="container">
    <div class="breadcrumb">
        <a th:href="@{/shop}">Inicio</a> &gt;
        <a th:href="@{/shop(category=${product.category.id})}" th:text="${product.category.name}">Categoría</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="detail">
        <div class="detail-img">
            <img th:if="${!product.images.isEmpty()}" th:src="@{${product.images[0].imageUrl}}" th:alt="${product.name}">
            <img th:if="${product.images.isEmpty()}" th:src="@{/images/placeholder.svg}" alt="Sin foto">
        </div>

        <div>
            <h1 th:text="${product.name}">Producto</h1>

            <a href="#reviews" class="rating-mini" th:if="${reviewCount > 0}">
                <strong th:text="${#numbers.formatDecimal(avgRating, 1, 'POINT', 1, 'COMMA')}">4,5</strong>
                <span class="stars" th:style="'--rating:' + ${avgRating}"></span>
                <span>(<span th:text="${reviewCount}">0</span> opiniones)</span>
            </a>

            <div class="detail-price">$ <span th:text="${#numbers.formatDecimal(product.price, 1, 'POINT', 0, 'COMMA')}">0</span></div>

            <div class="detail-meta">Vendido por <strong th:text="${product.store.name}">Tienda</strong></div>
            <div class="detail-meta">Categoría: <span th:text="${product.category.name}">Categoría</span></div>

            <div class="detail-stock" th:classappend="${product.stock <= 5} ? 'low'"
                 th:text="${product.stock > 0} ? (${product.stock <= 5} ? '¡Últimas ' + ${product.stock} + ' unidades!' : 'Stock disponible: ' + ${product.stock} + ' unidades') : 'Producto agotado'">Stock</div>

            <!-- Agregar al carrito -->
            <div class="buy-box" th:if="${product.stock > 0}">
                <form th:action="@{/cart/add}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <div>
                        <label for="qty">Cantidad</label>
                        <input type="number" id="qty" name="quantity" value="1" min="1" th:max="${product.stock}">
                    </div>
                    <button type="submit" class="btn">Agregar al carrito</button>
                </form>
            </div>

            <div class="detail-desc" th:if="${product.description != null and !#strings.isEmpty(product.description)}">
                <h3>Descripción</h3>
                <p th:text="${product.description}">Descripción</p>
            </div>
        </div>
    </div>

    <!-- Opiniones -->
    <section class="reviews" id="reviews">
        <h2>Opiniones del producto</h2>

        <div class="rating-summary" th:if="${reviewCount > 0}">
            <span class="rating-num" th:text="${#numbers.formatDecimal(avgRating, 1, 'POINT', 1, 'COMMA')}">4,5</span>
            <span class="stars" th:style="'--rating:' + ${avgRating}"></span>
            <span class="muted">(<span th:text="${reviewCount}">0</span> opiniones)</span>
        </div>
        <p class="muted" th:if="${reviewCount == 0}">Este producto aún no tiene opiniones.</p>

        <!-- Solo quien compró el producto puede opinar -->
        <div class="review-form" th:if="${canReview}">
            <h3 th:text="${myReview != null} ? 'Editar tu opinión' : 'Cuéntanos qué te pareció'">Tu opinión</h3>
            <form th:action="@{/shop/product/{id}/review(id=${product.id})}" method="post">
                <div class="star-input">
                    <input type="radio" id="star5" name="rating" value="5" required th:checked="${myReview != null and myReview.rating == 5}">
                    <label for="star5" title="Excelente">&#9733;</label>
                    <input type="radio" id="star4" name="rating" value="4" th:checked="${myReview != null and myReview.rating == 4}">
                    <label for="star4" title="Muy bueno">&#9733;</label>
                    <input type="radio" id="star3" name="rating" value="3" th:checked="${myReview != null and myReview.rating == 3}">
                    <label for="star3" title="Bueno">&#9733;</label>
                    <input type="radio" id="star2" name="rating" value="2" th:checked="${myReview != null and myReview.rating == 2}">
                    <label for="star2" title="Regular">&#9733;</label>
                    <input type="radio" id="star1" name="rating" value="1" th:checked="${myReview != null and myReview.rating == 1}">
                    <label for="star1" title="Malo">&#9733;</label>
                </div>

                <label for="comment">Comentario (opcional)</label>
                <textarea id="comment" name="comment" maxlength="500" placeholder="¿Qué te pareció el producto?"
                          th:text="${myReview != null} ? ${myReview.comment}"></textarea>

                <button type="submit" class="btn">Publicar opinión</button>
            </form>
        </div>
        <p class="muted" th:unless="${canReview}">Compra este producto para poder dejar tu opinión.</p>

        <!-- Lista de opiniones -->
        <div class="review" th:each="r : ${reviews}">
            <div class="review-top">
                <strong th:text="${r.buyer.fullName}">Comprador</strong>
                <span class="stars" th:style="'--rating:' + ${r.rating}"></span>
                <span class="muted" th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy')}">fecha</span>
            </div>
            <p th:if="${r.comment != null}" th:text="${r.comment}">Comentario</p>
        </div>
    </section>
</main>
</body>
</html>
